- user_query: 洛阳钼业历史上回撤超过25%出现过几次？
  intent: drawdown_event_lookup
  time_range: all_history
  matched_concepts:
    - stock_drawdown_events
  concept_layers:
    stock_drawdown_events: L1_business_concept
  concept_chain:
    - stock_drawdown_events
  atomic_entities:
    - stock_full_kline_history
  required_parameters:
    code: "603993"
    threshold: 0.25
  answer_style: event_summary_with_details
  missing_parameters: []

- user_query: 从历史统计来看，每次深度回撤后该割肉还是扛？
  intent: drawdown_recovery_decision
  time_range: all_history
  matched_concepts:
    - drawdown_recovery_stats
  concept_layers:
    drawdown_recovery_stats: L2_decision_concept
  concept_chain:
    - drawdown_recovery_stats
    - stock_drawdown_events
  atomic_entities:
    - stock_full_kline_history
  required_parameters:
    code: "603993"
    threshold: 0.25
    forward_windows: [60, 120]
  answer_style: statistical_analysis_with_verdict
  missing_parameters: []

- user_query: 洛阳钼业和紫金矿业对比一下近一个月表现？
