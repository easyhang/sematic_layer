# ============================================================
# Query 映射示例：典型用户问题到概念→实体→SQL 的映射链路
# ============================================================

- user_query: 贵州茅台最近一周走势怎么样？
  intent: stock_price_trend_check
  time_range: last_7_days
  matched_concepts:
    - stock_price_trend
  concept_layers:
    stock_price_trend: L1_business_concept
  concept_chain:
    - stock_price_trend
  atomic_entities:
    - daily_kline
  required_parameters:
    code: "600519"
    start_date: inferred:7_days_ago
    end_date: inferred:today
  answer_style: summary_with_trend_direction
  missing_parameters: []

- user_query: 今天哪些股票涨得最好？
  intent: top_gainers_lookup
  time_range: today
  matched_concepts:
    - stock_ranking
  concept_layers:
    stock_ranking: L1_business_concept
  concept_chain:
    - stock_ranking
  atomic_entities:
    - daily_market_snapshot
  required_parameters:
    date: today
    sort_by: pct_change_desc
    limit_count: 20
  answer_style: ranked_list
  missing_parameters: []

- user_query: 哪些股票今天发出了买入信号？
  intent: buy_signal_screening
  time_range: today
  matched_concepts:
    - stock_signal_summary
    - stock_investment_rating
  concept_layers:
    stock_signal_summary: L1_business_concept
    stock_investment_rating: L2_decision_concept
  concept_chain:
    - stock_investment_rating
    - stock_signal_summary
    - stock_price_trend
    - stock_indicator_profile
  atomic_entities:
    - stock_signal
    - daily_kline
    - stock_indicator_value
  required_parameters:
    date: today
    signal_bias: 偏多
  answer_style: ranked_list_with_reasons
  missing_parameters:
    - "⚠️ signals 和 indicators 表当前无数据，结果不可用。"

- user_query: 现在市场风险大吗？
  intent: market_risk_assessment
  time_range: current
  matched_concepts:
    - market_risk_assessment
  concept_layers:
    market_risk_assessment: L2_decision_concept
  concept_chain:
    - market_risk_assessment
    - market_trend_status
    - industry_performance
  atomic_entities:
    - market_environment
    - daily_kline
    - stock_basic_info
  required_parameters:
    date: today
  answer_style: risk_level_with_reasons
  missing_parameters:
    - "⚠️ market_regime 表当前无数据，风险评估结果不可用。"

- user_query: 最近有哪些行业在走强？
  intent: sector_rotation_analysis
  time_range: last_20_days
  matched_concepts:
    - sector_rotation_signal
  concept_layers:
    sector_rotation_signal: L2_decision_concept
  concept_chain:
    - sector_rotation_signal
    - industry_performance
  atomic_entities:
    - daily_kline
    - stock_basic_info
  required_parameters:
    lookback_short: 5d
    lookback_long: 20d
  answer_style: classified_list_with_reasons
  missing_parameters: []

- user_query: 帮我推荐20只好股票。
  intent: stock_selection_recommendation
  time_range: current
  matched_concepts:
    - top_stock_selection
  concept_layers:
    top_stock_selection: L2_decision_concept
  concept_chain:
    - top_stock_selection
    - stock_price_trend
    - multi_period_alignment
    - stock_signal_summary
    - stock_composite_score_overview
  atomic_entities:
    - daily_kline
    - weekly_kline
    - monthly_kline
    - stock_signal
    - composite_score_detail
  required_parameters:
    limit: 20
  answer_style: ranked_list_with_scores_and_reasons
  missing_parameters:
    - "⚠️ signals、indicators、composite_scores 表当前无数据，选股结果仅基于K线趋势。"

- user_query: 贵州茅台现在可以买吗？
  intent: buy_decision_inquiry
  time_range: current
  matched_concepts:
    - stock_investment_rating
  concept_layers:
    stock_investment_rating: L2_decision_concept
  concept_chain:
    - stock_investment_rating
    - stock_price_trend
    - stock_signal_summary
    - stock_indicator_profile
  atomic_entities:
    - daily_kline
    - stock_signal
    - stock_indicator_value
  required_parameters:
    code: "600519"
  answer_style: rating_with_reasons_and_risks
  missing_parameters:
    - "⚠️ signals 和 indicators 表无数据，投资评级仅基于价格趋势。"

- user_query: 有哪些股票出现了异动预警？
  intent: anomaly_detection_screening
  time_range: today
  matched_concepts:
    - stock_anomaly_alert
  concept_layers:
    stock_anomaly_alert: L2_decision_concept
  concept_chain:
    - stock_anomaly_alert
    - stock_price_trend
    - stock_volume_analysis
  atomic_entities:
    - daily_kline
  required_parameters:
    date: today
  answer_style: alert_list_with_details
  missing_parameters: []

- user_query: 日线周线月线都向上的股票有哪些？
  intent: multi_period_alignment_screening
  time_range: current
  matched_concepts:
    - multi_period_alignment
    - top_stock_selection
  concept_layers:
    multi_period_alignment: L1_business_concept
    top_stock_selection: L2_decision_concept
  concept_chain:
    - top_stock_selection
    - multi_period_alignment
  atomic_entities:
    - daily_kline
    - weekly_kline
    - monthly_kline
  required_parameters:
    alignment: 三线共振向上
    limit: 30
  answer_style: ranked_list
  missing_parameters: []

- user_query: 最近有没有成交量突然放大的股票？
  intent: volume_spike_detection
  time_range: recent_days
  matched_concepts:
    - stock_volume_analysis
    - stock_anomaly_alert
  concept_layers:
    stock_volume_analysis: L1_business_concept
    stock_anomaly_alert: L2_decision_concept
  concept_chain:
    - stock_anomaly_alert
    - stock_volume_analysis
  atomic_entities:
    - daily_kline
  required_parameters:
    date_range: last_5_days
    volume_threshold: 3x_20day_avg
  answer_style: alert_list_with_reasons
  missing_parameters: []

- user_query: 食品饮料行业最近表现怎么样？
  intent: industry_performance_inquiry
  time_range: recent_period
  matched_concepts:
    - industry_performance
  concept_layers:
    industry_performance: L1_business_concept
  concept_chain:
    - industry_performance
  atomic_entities:
    - daily_kline
    - stock_basic_info
  required_parameters:
    industry: from_query_context
    date_range: last_7_days
  answer_style: summary_with_metrics
  missing_parameters:
    - "行业名称需要从 stocks.industry 字段匹配，当前存储格式为申万三级编码+名称（如 G15酒、饮料和精制茶制造业），用户输入的'食品饮料'可能需要模糊匹配。"

- user_query: 数据更新正常吗？最近有没有失败的更新任务？
  intent: data_pipeline_health_check
  time_range: recent
  matched_concepts: []
  concept_layers: {}
  concept_chain: []
  atomic_entities:
    - data_update_status
  required_parameters:
    limit_count: 10
  answer_style: status_summary
  missing_parameters:
    - "⚠️ update_log 表当前无数据，无法判断数据管道状态。"

- user_query: stocks 表有哪些字段？
  intent: schema_exploration
  time_range: none
  matched_concepts: []
  concept_layers: {}
  concept_chain: []
  atomic_entities:
    - table_field_dictionary
  required_parameters:
    table_name: stocks
  answer_style: field_list_with_descriptions
  missing_parameters: []

