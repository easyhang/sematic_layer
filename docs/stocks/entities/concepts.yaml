- id: stock_comparison
  name: 个股对比分析
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 对 2-5 只指定股票在选定时间段内的价格走势、成交量变化和波动特征进行并列对比，帮助判断相对强弱和差异性。
  depends_on:
    - daily_kline
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 对每只目标股票分别调用 daily_kline 获取指定时间段的日K线数据。
      2. 计算每只股票的区间涨跌幅、日均成交量、日均换手率和振幅。
      3. 并排对比各股票的上述指标，识别表现最优和最差的股票。
      4. 计算价格走势的同步性（如果两只股票走势高度相似，可能受同一板块/因子驱动）。
    explanation: 多股票并排对比是投资者选股决策前的常见需求，通过量化对比替代主观感受。
  business_keywords:
    - 对比
    - 比较
    - VS
    - 孰强孰弱
    - 选哪个
    - 并列比较
    - 横向对比
  example_queries:
    - 茅台和五粮液最近一周走势对比？
    - 洛阳钼业和紫金矿业谁最近更强？
    - 对比一下工商银行和建设银行近一个月的表现？
  interpretation_rule: 区间涨幅高且波动小的股票标记为"相对强势"。若两只股票走势方向高度一致（相关系数>0.8），提示"可能受同一板块驱动"。
  answer_template: "{{date_range}}内，对比{{stock_count}}只股票：{{#stocks}}{{name}}（{{code}}）涨跌幅{{pct_change}}%，日均换手率{{avg_turnover}}%，振幅{{amplitude}}%。{{/stocks}}{{#verdict}}综合来看，{{verdict}}。{{/verdict}}"
  assumptions:
    - "对比股票数量限制为 2-5 只，过多则回答冗长且难以形成清晰结论。"
    - "走势同步性判断基于涨跌幅序列的简化相关分析，非严格的统计检验。"
  validation_cases:
    - input: { codes: ["600519", "000858"], date_range: "last_7_days" }
      expected: stocks is list, length = 2, each has pct_change and avg_turnover
    - input: { codes: ["603993", "601899"] }
      expected: stocks is list, verdict is string

- id: stock_drawdown_events
  name: 历史回撤事件
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 识别个股历史上每一次"股价从近 250 个交易日最高点回撤达到或超过指定阈值"的事件，返回每次回撤的触发日期、触发价格、峰值价格、回撤幅度和持续天数。用于量化个股深度回撤的历史频率和严重程度。
  depends_on:
    - stock_full_kline_history
  composition_type: exception_detection
  composition_rule:
    logic: |
      1. 获取该股全部历史日K线数据（按日期升序）。
      2. 使用窗口函数计算每个交易日的 250 日滚动最高收盘价：MAX(close) OVER (ROWS BETWEEN 249 PRECEDING AND CURRENT ROW)。
      3. 识别触发日：收盘价 ≤ 滚动最高价 × (1 - 回撤阈值)，默认阈值 25%。
      4. 将连续的触发日合并为同一事件，每个事件取第一个触发日作为事件起点。
      5. 对每个事件，记录：触发日期、触发价、250日峰值价、回撤幅度%、至今持续天数。
      6. 排除仍在进行中的最后一个事件（或标记为"当前事件"）。
      7. 参考 SQL 实现：
         WITH rolling AS (
           SELECT date, close,
             MAX(close) OVER (ORDER BY date ROWS BETWEEN 249 PRECEDING AND CURRENT ROW) AS peak_250d
           FROM kline_daily WHERE code = 'XXXXXX'
         ),
         triggers AS (
           SELECT *, close / peak_250d - 1 AS drawdown_pct,
             LAG(close / peak_250d - 1) OVER (ORDER BY date) AS prev_drawdown_pct
           FROM rolling
         )
         SELECT date, close AS trigger_price, peak_250d AS peak_price,
           ROUND(drawdown_pct * 100, 2) AS drawdown_pct
         FROM triggers
         WHERE drawdown_pct <= -0.25 AND (prev_drawdown_pct > -0.25 OR prev_drawdown_pct IS NULL)
         ORDER BY date
    explanation: 回撤事件识别是风险管理和持仓决策的量化基础，帮助投资者了解一只股票在极端不利情况下的历史表现模式。
  business_keywords:
    - 回撤
    - 回调
    - 历史最大回撤
    - 深度调整
    - 高位回落
    - 被套
    - 浮亏
    - 抄底
  example_queries:
    - 这只股票历史上从高点回撤超过25%出现过几次？
    - 每次深度回撤之后一般怎么走？
    - 现在这次回撤在历史上属于什么水平？
    - 历史上最大回撤是多少？
  interpretation_rule: 回撤超过 25% 为"深度回撤"，超过 40% 为"极端回撤"。统计回撤发生的频率（年均次数）和平均回撤幅度，帮助判断当前回撤是否异常。
  answer_template: "{{code}} {{name}} 自上市以来共触发{{event_count}}次深度回撤事件（回撤≥{{threshold}}%）。最近一次：{{last_event_date}}，回撤{{last_drawdown_pct}}%。历史最大回撤：{{max_drawdown_pct}}%（{{max_drawdown_date}}）。{{#current_event}}当前正处于一次回撤事件中（触发于{{current_trigger_date}}）。{{/current_event}}"
  assumptions:
    - "回撤阈值默认 25%，可通过参数调整。"
    - "滚动窗口长度默认 250 个交易日（约一年），适合 A 股年度周期。"
    - "连续触发日合并为同一事件，避免同一波下跌被重复计数。"
    - "该概念需要 SQLite 窗口函数支持（SQLite 3.25+），本地环境已验证可用。"
  validation_cases:
    - input: { code: "603993", threshold: 0.25 }
      expected: event_count > 0, each event has trigger_date and drawdown_pct
    - input: { code: "600519" }
      expected: max_drawdown_pct <= -25

# ==============================
# L2 决策概念扩展（2026-06-12 补充）
# ==============================

- id: drawdown_recovery_stats
  name: 回撤恢复统计
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 在识别个股历史回撤事件的基础上，计算每次回撤后在 60 日和 120 日窗口内的反弹概率、平均反弹幅度和首次回正天数，给出基于历史统计的持仓决策参考。适用于投资者在深度浮亏时客观评估"割肉还是扛"的决策。
  depends_on:
    - stock_drawdown_events
  source_atomic_entities:
    - stock_full_kline_history
  composition_type: health_score
  composition_rule:
    logic: |
      1. 从 stock_drawdown_events 获取所有回撤事件的触发日期和触发价格。
      2. 对每个事件，使用 stock_full_kline_history 获取触发日后 60/120 个交易日的收盘价数据。
      3. 计算每个事件的 60 日/120 日前瞻指标：
         - 最终涨跌幅：(事件后第 N 日收盘价 / 触发价 - 1) × 100%
         - 最大反弹幅度：(事件后 N 日内最高价 / 触发价 - 1) × 100%
         - 是否上涨：最终涨跌幅 > 0
         - 首次回正天数：事件后首次收盘价 > 触发价的天数（未回正则标记为 None）
      4. 聚合统计：
         - 上涨概率：上涨事件数 / 总事件数 × 100%
         - 平均最终涨跌幅（全部事件 / 仅上涨事件 / 仅下跌事件）
         - 平均最大反弹幅度
         - 平均回正天数（仅上涨事件）
      5. 排除当前仍在进行中的事件后，给出"历史胜率"。
      6. 参考 SQL 实现（关键片段）：
         WITH events AS (...),
         forward AS (
           SELECT e.event_date, e.trigger_price,
             LEAD(k.close, 60) OVER (ORDER BY k.date) AS close_60d,
             MAX(k.high) OVER (ORDER BY k.date ROWS BETWEEN 1 FOLLOWING AND 60 FOLLOWING) AS max_high_60d
           FROM kline_daily k JOIN events e ON k.date = e.event_date
         )
         SELECT
           COUNT(*) AS total_events,
           SUM(CASE WHEN close_60d > trigger_price THEN 1 ELSE 0 END) AS up_count,
           ROUND(AVG((close_60d / trigger_price - 1) * 100), 2) AS avg_pct_60d
         FROM forward
    explanation: 这是从"描述回撤"到"决策支持"的关键跃升。历史统计不保证未来结果，但提供了客观的概率基准，帮助投资者在情绪化决策时回归理性。
  business_keywords:
    - 反弹概率
    - 回本概率
    - 历史胜率
    - 割肉还是扛
    - 回撤恢复
    - 解套
    - 统计套利
    - 回测
  example_queries:
    - 这只股票每次回撤超过25%后，60天内涨回来的概率是多少？
    - 历史上深度回撤后平均能反弹多少？
    - 从历史统计看，现在该割肉还是继续持有？
    - 回撤后120天能回到成本价的概率多大？
  interpretation_rule: 上涨概率 > 60% 为"历史偏乐观"，40-60% 为"历史中性"，< 40% 为"历史偏悲观"。结合平均反弹幅度评估盈亏比：如果平均反弹幅度 < 当前浮亏幅度，提示"历史反弹不足以回本"。
  answer_template: "{{code}} {{name}} 自上市以来触发过{{total_events}}次回撤≥{{threshold}}%事件（排除当前后{{historical_events}}次）。统计结果：\n- 60日内上涨概率：{{prob_up_60d}}%（{{up_60d}}/{{total_with_data_60d}}），平均涨幅 {{avg_pct_60d}}%\n- 120日内上涨概率：{{prob_up_120d}}%（{{up_120d}}/{{total_with_data_120d}}），平均涨幅 {{avg_pct_120d}}%\n- 平均最大反弹（60日）：{{avg_max_60d}}%\n{{#current_event}}当前事件：触发于{{current_trigger_date}}，触发价{{current_trigger_price}}，至今仅过去{{current_elapsed_days}}个交易日，尚无统计意义。{{/current_event}}{{#verdict}}历史结论：{{verdict}}。{{/verdict}}仅供参考，不构成投资建议。"
  assumptions:
    - "回撤阈值默认 25%，前瞻窗口默认 60 日和 120 日，均可通过参数调整。"
    - "历史统计基于该股自身数据，不同股票的回撤行为可能差异很大，不可跨股套用。"
    - "当前事件的统计应被排除或单独标注，因为前瞻窗口尚未走完。"
    - "统计结果受样本量影响：上市时间短的股票事件数可能不足，统计显著性有限。"
    - "该分析需要执行多条SQL并做聚合计算，概念层的 composition_rule 提供了计算逻辑和参考SQL，实际执行可能需要借助 Python/sqlite3 脚本完成窗口计算和统计聚合。"
  validation_cases:
    - input: { code: "603993", threshold: 0.25, forward_windows: [60, 120] }
      expected: prob_up_60d is number between 0 and 100, avg_pct_60d is number
    - input: { code: "600519", threshold: 0.20 }
      expected: total_events >= 0, historical_events <= total_events
