# ============================================================
# 概念实体：A股技术分析语义层
# L1 业务概念：由L0 原子实体组合而成的业务观察
# L2 决策概念：由 L1 概念组合而成的判断、分类、预警或决策
# ============================================================

# ==============================
# L1 业务概念 (Business Concepts)
# ==============================

- id: stock_price_trend
  name: 股价趋势
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 描述个股在一段时间内的价格走势方向、强度和关键价位变化。基于日K线的开高低收数据，判断上涨、下跌或横盘趋势。
  depends_on:
    - daily_kline
  composition_type: trend
  composition_rule:
    logic: |
      1. 计算指定时间段内的价格变化方向和幅度（(close_end - close_start) / close_start）。
      2. 识别趋势类型：上升趋势（连续高点和低点上移）、下降趋势（连续高点和低点下移）、横盘震荡（高低点在一定范围内波动）。
      3. 计算区间振幅（(high_max - low_min) / close_start）和波动率。
      4. 标注近期关键支撑位和压力位。
    explanation: 通过日K线的收盘价序列判断方向，结合高低点结构识别趋势状态，量化振幅和波动程度。
  business_keywords:
    - 股价趋势
    - 涨跌走势
    - 价格方向
    - 趋势判断
    - 技术面走势
    - 行情走势
  example_queries:
    - 贵州茅台最近一周走势怎么样？
    - 最近一个月股价是涨了还是跌了？
    - 哪些股票处于上升趋势？
    - 这只股票最近波动大吗？
  interpretation_rule: 结合涨跌幅、趋势方向和波动率综合描述价格表现。趋势方向使用"上升/下降/横盘"，强度使用"强势/温和/弱势"。
  answer_template: "{{date_range}}内，{{code}} {{name}} 股价呈{{trend_direction}}趋势，从{{start_price}}元变动至{{end_price}}元（{{pct_change}}%），区间振幅{{amplitude}}%。{{#key_levels}}关键支撑位{{support}}，压力位{{resistance}}。{{/key_levels}}"
  assumptions:
    - "趋势判断基于收盘价序列的连续比较，未使用均线系统。如需均线趋势，需额外定义。"
    - "支撑位和压力位基于区间最高价和最低价，非严格的技术分析定义。"
  validation_cases:
    - input: { code: "600519", date_range: "last_7_days" }
      expected: trend_direction in ("上升", "下降", "横盘")
    - input: { code: "000001", date_range: "last_30_days" }
      expected: pct_change is number, amplitude is number

- id: stock_volume_analysis
  name: 成交量分析
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 分析个股的成交量变化、换手率水平和量价配合关系，判断资金进出活跃度和量价背离风险。
  depends_on:
    - daily_kline
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 计算指定时间段内的日均成交量、日均成交额和日均换手率。
      2. 对比前一周期的成交量变化（放量/缩量/持平）。
      3. 判断量价配合关系：价涨量增（健康）、价涨量缩（背离）、价跌量增（恐慌/承接）、价跌量缩（冷清）。
      4. 计算换手率分位：相比历史水平的活跃度位置。
    explanation: 将价格变动和成交量/换手率组合分析，判断资金行为和量价关系是否健康。
  business_keywords:
    - 成交量
    - 换手率
    - 放量
    - 缩量
    - 量价关系
    - 资金流向
    - 成交活跃度
  example_queries:
    - 最近这只股票成交量有没有放大？
    - 换手率最近什么水平？
    - 今天哪些股票放量上涨？
    - 有没有量价背离的股票？
  interpretation_rule: 从成交绝对量、相对变化和量价配合三个维度描述。放量/缩量以1.5倍/0.67倍为阈值。量价关系分为"量价配合/量价背离/量价正常"。
  answer_template: "{{date_range}}内，{{code}} 日均成交量{{avg_volume}}股（较前期{{volume_change_desc}}），日均换手率{{avg_turnover}}%，量价关系：{{volume_price_relation}}。"
  assumptions:
    - "放量/缩量的阈值设定为成交量变化超过1.5倍/不足0.67倍，可能需要根据个股历史波动调整。"
    - "量价关系判断基于价格和成交量同向/反向的简化规则，不考虑主力资金对倒等复杂情况。"
  validation_cases:
    - input: { code: "600519", date_range: "last_7_days" }
      expected: avg_volume > 0, avg_turnover >= 0
    - input: { code: "000001", date_range: "last_30_days" }
      expected: volume_change_desc in ("放量", "缩量", "持平")

- id: multi_period_alignment
  name: 多周期共振
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 对比日线、周线、月线三个时间周期的价格趋势方向，判断多周期是否形成共振（同向）或背离（反向），用于确认趋势的可靠性。
  depends_on:
    - daily_kline
    - weekly_kline
    - monthly_kline
  composition_type: trend
  composition_rule:
    logic: |
      1. 分别计算日线（近20日）、周线（近10周）、月线（近6月）的收盘价趋势方向和变化幅度。
      2. 判断三周期方向一致性：三线共振向上（强信号）、二上一下（偏强）、三线共振向下（弱信号）、二下一上（偏弱）。
      3. 如果大周期（月线）向上而小周期（日线）回调，识别为"大趋势中的正常回调"。
      4. 如果大周期向下而小周期反弹，识别为"熊市反弹，追高风险大"。
    explanation: 多周期分析是技术分析中确认趋势可靠性的核心方法，大周期定方向，小周期找买卖点。
  business_keywords:
    - 多周期
    - 日线周线月线
    - 共振
    - 趋势确认
    - 大周期
    - 小周期
    - 周期背离
  example_queries:
    - 日线周线月线趋势一致吗？
    - 哪些股票日周月三线共振向上？
    - 日线回调但周线还是上升趋势吗？
  interpretation_rule: 三周期全部向上为"强势共振"，全部向下为"弱势共振"，混合情况根据大级别方向给出判断。
  answer_template: "{{code}} 多周期趋势：日线{{daily_trend}}、周线{{weekly_trend}}、月线{{monthly_trend}}。{{alignment_judgment}}。"
  assumptions:
    - "日线趋势基于近20个交易日，周线基于近10周，月线基于近6个月。周期长度可根据分析需要调整。"
    - "趋势判断基于收盘价序列，不涉及均线交叉等技术指标。"
  validation_cases:
    - input: { code: "600519" }
      expected: daily_trend in ("上升", "下降", "横盘"), monthly_trend in ("上升", "下降", "横盘")
    - input: { code: "000001" }
      expected: alignment_judgment is string and length > 0

- id: stock_signal_summary
  name: 信号汇总
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 将个股的四层交易信号（L1基础→L2复合→L3交易体系→L4市场环境）按维度和层级进行聚合汇总，提供信号强弱分布和方向判断。
  depends_on:
    - stock_signal
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 按 layer 分组统计各层的信号总数、正信号数（score>0）、负信号数（score<0）、中性信号数（score=0）。
      2. 按 dimension 分组统计各维度的总得分（SUM(score)）和信号数量。
      3. 计算信号一致率：同一层内正/负信号的比例，判断是否存在矛盾信号。
      4. 提取得分最高（+2）和最低（-2）的信号及原因。
    explanation: 将分散的原子信号聚合成层次化视图，从层级和维度两个角度理解信号的强度和一致性。
  business_keywords:
    - 交易信号
    - 买卖信号
    - 信号强度
    - L1信号
    - L2信号
    - L3信号
    - 信号一致
    - 信号矛盾
  example_queries:
    - 这只股票最近有什么交易信号？
    - 哪些信号在提示买入？
    - 信号之间有矛盾吗？
    - 哪一层信号最强？
  interpretation_rule: 各层正信号占比>60%为偏多，负信号占比>60%为偏空，否则为中性分歧。维度得分>该维度信号数*50%为偏强。
  answer_template: "{{date_range}}内，{{code}} 共产生{{total_signals}}条信号。L1层{{l1_positive}}正/{{l1_total}}总，L2层{{l2_positive}}正/{{l2_total}}总。综合信号偏向：{{signal_bias}}。最强信号：{{top_signals}}。"
  assumptions:
    - "⚠️ signals 表当前无数据，处于设计阶段。此概念的数据可用性依赖于信号计算任务上线。"
    - "信号评分范围为 -2 到 +2，0 表示中性无方向信号。"
  validation_cases:
    - input: { code: "600519", date_range: "last_7_days" }
      expected: total_signals >= 0, signal_bias in ("偏多", "偏空", "中性分歧")
    - input: { code: "000001" }
      expected: l1_total >= 0

- id: stock_indicator_profile
  name: 技术指标画像
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 综合个股的多个技术指标计算结果，形成技��指标画像，判断各指标当前处于超买/超卖/中性区间，以及指标间的相互印证或背离。
  depends_on:
    - stock_indicator_value
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 对 RSI 类指标：>70 超买，<30 超卖，30-70 中性。
      2. 对 MACD 类指标：DIF>DEA 且 MACD柱>0 为多头，反之为空头。
      3. 对 KDJ 类指标：K>80 超买，K<20 超卖。
      4. 统计超买指标数、超卖指标数、多头指标数、空头指标数。
      5. 判断指标间共振或背离：多个趋势指标同时指向同一方向为共振；价格新高但指标未新高为顶背离。
    explanation: 将多个技术指标的读数映射到统一的判断区间，形成指标维度的综合画像。
  business_keywords:
    - 技术指标
    - RSI
    - MACD
    - KDJ
    - 超买超卖
    - 指标背离
    - 指标共振
  example_queries:
    - 这只股票的RSI现在多少？超买了吗？
    - MACD现在是多头还是空头？
    - 技术指标整体偏多还是偏空？
    - 有没有顶背离的信号？
  interpretation_rule: 多数指标指向同一方向为强信号，指标分歧为弱信号。超买/超卖需要结合趋势方向判断（趋势中可持续超买/超卖）。
  answer_template: "{{code}} 技术指标画像：RSI {{rsi_value}}（{{rsi_status}}），MACD {{macd_status}}。整体偏{{indicator_bias}}，{{divergence_warning}}。"
  assumptions:
    - "⚠️ indicators 表当前无数据，处于设计阶段。此概念的数据可用性依赖于指标计算任务上线。"
    - "超买/超卖/多空区间的阈值使用通用标准值，可能因个股特性和市场环境需要调整。"
    - "indicator_name 的实际枚举值需要待数据填充后确认。"
  validation_cases:
    - input: { code: "600519", indicator_names: ["rsi_14", "macd"] }
      expected: indicator_bias in ("偏多", "偏空", "中性")
    - input: { code: "000001" }
      expected: rsi_status in ("超买", "超卖", "中性", "未知")

- id: market_trend_status
  name: 市场趋势状态
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 描述整体市场的运行状态，包括牛熊判断、市场宽度（上涨股票占比）、指数涨跌、异常事件和信号可信度调整。
  depends_on:
    - market_environment
  composition_type: trend
  composition_rule:
    logic: |
      1. 读取当前市场 regime 状态（strong_bull/bull/sideways/bear/extreme_bear）。
      2. 结合 market_breadth（上涨占比）验证 regime 判断：bull环境下上涨占比应>50%。
      3. 检测 anomaly_type 是否为异常事件（macro_event/volume_spike/volatility_spike）。
      4. 输出信号可信度乘数：confidence 值直接影响个股信号的权重。
    explanation: 市场环境是技术分析的风控维度，帮助判断当前是否适合交易以及信号可信度。
  business_keywords:
    - 市场环境
    - 大盘
    - 牛熊市
    - 市场状态
    - 市场宽度
    - 涨跌比
    - 市场异常
  example_queries:
    - 现在市场是牛市还是熊市？
    - 今天大盘涨了多少？
    - 最近市场有异常吗？
    - 上涨的股票多还是下跌的多？
  interpretation_rule: regime 映射为中文描述（strong_bull→强势牛市，bull→牛市，sideways→震荡，bear→熊市，extreme_bear→极端熊市）。confidence<0.5 提示信号可信度降低。
  answer_template: "当前市场处于{{regime_cn}}状态，大盘指数{{index_close}}（{{index_pct_change}}%），上涨股票占比{{market_breadth_pct}}%。{{#anomaly}}⚠️ 异常事件：{{anomaly_type}}。{{/anomaly}}信号可信度：{{confidence_level}}。"
  assumptions:
    - "⚠️ market_regime 表当前无数据，处于设计阶段。"
    - "regime 的分类阈值和计算逻辑由上游任务决定。"
    - "confidence 降低的机制（在市场异常时降低）在设计文档中有说明，但具体降幅未定义。"
  validation_cases:
    - input: { date: "2026-06-02" }
      expected: regime_cn in ("强势牛市", "牛市", "震荡", "熊市", "极端熊市")
    - input: {}
      expected: market_breadth >= 0 and market_breadth <= 1

- id: industry_performance
  name: 行业表现
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 按行业（申万三级分类）聚合个股的涨跌幅、成交量等数据，对比各行业的相对强弱，识别领涨/领跌行业。
  depends_on:
    - daily_kline
    - stock_basic_info
  composition_type: metric_group
  composition_rule:
    logic: |
      1. JOIN stocks 和 kline_daily，按 industry 分组聚合。
      2. 计算每个行业的平均涨跌幅、涨跌比（上涨股票数/总股票数）、总成交额。
      3. 按平均涨跌幅排序，识别 Top N 领涨行业和 Bottom N 领跌行业。
      4. 对比当前行业表现与上一周期的变化，判断行业动量。
    explanation: 行业维度的聚合分析，帮助判断资金在行业间的流动方向。
  business_keywords:
    - 行业
    - 板块
    - 申万行业
    - 领涨
    - 领跌
    - 行业轮动
    - 板块表现
  example_queries:
    - 今天哪些行业涨得最好？
    - 食品饮料行业最近表现怎么样？
    - 最近资金在往哪些行业流？
    - 各行业的涨跌比如何？
  interpretation_rule: 行业平均涨幅>2%为强势，<-2%为弱势。行业上涨股票占比>70%为普涨，<30%为普跌。
  answer_template: "{{date}}，表现最好的行业是{{top_industries}}，领跌行业是{{bottom_industries}}。{{#query_industry}}{{industry_name}}行业平均涨跌幅{{avg_pct}}%，上涨{{up_count}}家/共{{total_count}}家。{{/query_industry}}"
  assumptions:
    - "industry/sector 字段存储的是申万三级行业编码+名称组合文本（如 J66货币金融服务），非标准化编码，聚合时需注意空格和编码格式。"
    - "行业分类以 stocks 表的 industry 字段为准，当前与 sector 字段值相同。"
    - "仅聚合 is_active=1 的在市股票。"
  validation_cases:
    - input: { date: "2024-01-02" }
      expected: industry count > 0, each industry has avg_pct
    - input: { industry: "J66货币金融服务", date: "2024-01-02" }
      expected: avg_pct is number, total_count > 0

- id: stock_ranking
  name: 个股截面排名
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 对指定交易日全市场个股按涨跌幅、成交量、换手率、成交额或振幅进行截面排名，返回 Top N 或 Bottom N 股票列表。用于每日强势股/弱势股筛选、活跃股识别和高振幅异动排查。
  depends_on:
    - daily_market_snapshot
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 使用 daily_market_snapshot 获取指定日期的全市场个股截面数据。
      2. 按用户指定的排序指标（涨跌幅/成交量/换手率/成交额/振幅）升序或降序排列。
      3. 可选按行业过滤，仅看某个行业内的排名。
      4. 返回 Top N（默认 20），附代码、名称、行业和排序指标值。
      5. 对排名结果按分位打标签：前 5% 为"极度强势"，后 5% 为"极度弱势"。
    explanation: 个股截面排名是最基础的选股筛选器，通过单一指标排序快速定位目标股票池。
  business_keywords:
    - 排名
    - 涨幅榜
    - 跌幅榜
    - 放量
    - 换手率排名
    - 振幅排名
    - 强势股
    - 弱势股
    - Top N
    - 涨幅最大
    - 跌得最多
    - 成交最大
  example_queries:
    - 今天涨得最好的 20 只股票有哪些？
    - 今天跌得最多的 10 只股票？
    - 最近一个交易日换手率最高的股票？
    - 食品饮料行业今天涨幅排名前 10？
    - 今天哪些股票振幅最大？
  interpretation_rule: 涨幅榜标注"强势"，跌幅榜标注"弱势"。结合 rank 位置给出排名解读。如查询含行业过滤，标注"在{{industry}}行业内"。
  answer_template: "{{date}}，{{#industry}}在{{industry}}行业中，{{/industry}}表现{{rank_direction}}的{{limit_count}}只股票：{{#stocks}}{{rank}}. {{name}}（{{code}}）— {{metric_label}} {{metric_value}}。{{/stocks}}"
  assumptions:
    - "排名基于单一交易日的截面数据，不反映趋势和持续性。"
    - "日期参数为必填，需从用户问题中确认（如'今天'→查最新交易日）。"
    - "振幅超过 15% 为异常波动，需结合 stock_anomaly_alert 做综合判断。"
  validation_cases:
    - input: { date: "2026-06-02", sort_by: "pct_change_desc", limit_count: 20 }
      expected: stocks is list, length = 20, sorted by pct_change descending
    - input: { date: "2026-06-02", sort_by: "pct_change_asc", limit_count: 10 }
      expected: first stock has most negative pct_change

- id: stock_composite_score_overview
  name: 综合评分概览
  entity_type: concept
  concept_layer: L1_business_concept
  version: 1
  description: 查看个股的综合评分全貌，包括总分、评级、各层/各维度/各体系得分分解和风险提示，是综合评分明细的语义化包装。
  depends_on:
    - composite_score_detail
  composition_type: metric_group
  composition_rule:
    logic: |
      1. 读取 total_score 和 level，给出总体评价。
      2. 解析 layer_scores JSON，展示 L1-L4 各层的得分贡献。
      3. 解析 dimension_scores JSON，展示 trend/momentum/volume_price 等维度的强弱。
      4. 解析 system_scores JSON，展示 turtle/chanlun/wave 等交易体系的信号一致性。
      5. 解析 risk_warnings JSON，列出需要关注的风险点。
    explanation: 将综合评分的 JSON 明细字段展开为结构化的多维度分析报告。
  business_keywords:
    - 综合评分
    - 评级
    - 买卖评级
    - 得分明细
    - 风险提示
    - 综合评估
  example_queries:
    - 贵州茅台的综合评分是多少？
    - 哪些股票评级是强烈买入？
    - 得分最高的股票是哪些？
    - 综合评分的构成是怎样的？
  interpretation_rule: level 映射为中文：strong_buy→强烈买入，buy→买入，neutral→中性，sell→卖出，strong_sell→强烈卖出。total_score 范围取决于上游权重，目前假设 0-5 分制。
  answer_template: "{{code}} {{name}} 综合评分{{total_score}}，评级：{{level_cn}}，可信度{{confidence}}。各层得分：{{layer_breakdown}}。最强维度：{{strongest_dimension}}。{{#risk_warnings}}⚠️ 风险提示：{{risk_list}}。{{/risk_warnings}}"
  assumptions:
    - "⚠️ composite_scores 表当前无数据，处于设计阶段。"
    - "total_score 的取值范围和评级阈值由上游评分模型决定，目前假设为 0-5 分制。"
    - "layer_scores/dimension_scores/system_scores JSON 的 key 枚举值需要待数据填充后确认。"
    - "各交易体系的权重分配方案未在数据库文档中说明。"
  validation_cases:
    - input: { code: "600519" }
      expected: level_cn in ("强烈买入", "买入", "中性", "卖出", "强烈卖出")
    - input: {}
      expected: total_score is number

