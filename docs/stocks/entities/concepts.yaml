- id: stock_investment_rating
  name: 股票投资评级
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 综合股价趋势、技术信号和技术指标，对个股给出买入/持有/卖出的投资建议。适用于需要明确买卖方向的投资决策场景。
  depends_on:
    - stock_price_trend
    - stock_signal_summary
    - stock_indicator_profile
  source_atomic_entities:
    - daily_kline
    - stock_signal
    - stock_indicator_value
  composition_type: health_score
  composition_rule:
    logic: |
      1. 趋势维度（weight 40%）：上升趋势 +2，横盘 0，下降趋势 -2。
      2. 信号维度（weight 35%）：信号偏多 +2，中性 0，偏空 -2。如有矛盾降低权重。
      3. 指标维度（weight 25%）：指标偏多 +2，中性 0，偏空 -2。如有超买/超卖叠加判断。
      4. 加权汇总：score >= 1.2 → 买入，0.4~1.2 → 持有，-0.4~0.4 → 观望，-1.2~-0.4 → 减仓，< -1.2 → 卖出。
    explanation: 多维度加权打分模型，趋势定方向，信号定时机，指标验强度。
  business_keywords:
    - 投资评级
    - 买卖建议
    - 买入
    - 卖出
    - 持有
    - 加仓
    - 减仓
    - 操作建议
  example_queries:
    - 贵州茅台现在可以买吗？
    - 哪些股票建议买入？
    - 这股票该不该卖？
    - 推荐几只可以持有的股票？
  answer_template: "{{code}} {{name}} 投资评级：{{rating}}（加权得分{{weighted_score}}）。趋势{{trend_score_desc}}，信号{{signal_score_desc}}，指标{{indicator_score_desc}}。建议：{{recommendation}}。"
  assumptions:
    - "三因子权重（40/35/25）为初始设定，需根据回测效果调整。"
    - "评级阈值需要在实盘数据上校准。"
    - "当前 signals 和 indicators 表无数据，此概念的完整评估需待数据填充后验证。"
  validation_cases:
    - input: { code: "600519" }
      expected: rating in ("买入", "持有", "观望", "减仓", "卖出")
    - input: { code: "000001" }
      expected: weighted_score is number

- id: market_risk_assessment
  name: 市场风险评估
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 结合市场趋势状态和行业表现，评估当前整体市场的风险等级，判断是否适合积极交易、应降低仓位或避险。适用于风控和仓位管理决策。
  depends_on:
    - market_trend_status
    - industry_performance
  source_atomic_entities:
    - market_environment
    - daily_kline
    - stock_basic_info
  composition_type: health_score
  composition_rule:
    logic: |
      1. 市场状态风险系数：strong_bull→低风险(0.2)，bull→中低风险(0.4)，sideways→中风险(0.6)，bear→中高风险(0.8)，extreme_bear→高风险(1.0)。
      2. 市场宽度风险调整：上涨占比<30% 增加0.15，上涨占比>70% 减少0.1。
      3. 异常事件风险加成：macro_event +0.3，volatility_spike +0.2，volume_spike +0.1。
      4. 行业表现恶化风险：如领跌行业平均跌幅>5%，增加0.1。
      5. 最终风险等级：0-0.25→低风险，0.25-0.5→中低风险，0.5-0.65→中风险，0.65-0.8→中高风险，0.8-1.0→高风险。
    explanation: 层次化风险评估模型，从市场整体状态、宽度、异常事件和行业表现四个维度综合量化风险。
  business_keywords:
    - 市场风险
    - 风控
    - 仓位管理
    - 风险等级
    - 避险
    - 可交易性
    - 市场环境评估
  example_queries:
    - 现在市场风险大吗？
    - 当前适合买入吗？
    - 需要减仓避险吗？
    - 市场有没有系统性风险？
  answer_template: "当前市场风险等级：{{risk_level}}（风险系数{{risk_score}}）。{{risk_factors}}。建议：{{risk_recommendation}}。"
  assumptions:
    - "风险系数的量化模型为初始设计，各因子权重和阈值需要根据历史回撤数据校准。"
    - "macro_event 的具体触发条件（如央行政策、地缘事件）未在数据库层定义，依赖上游 market_regime 计算。"
  validation_cases:
    - input: {}
      expected: risk_level in ("低风险", "中低风险", "中风险", "中高风险", "高风险")
    - input: { date: "2026-06-02" }
      expected: risk_score >= 0 and risk_score <= 1

- id: stock_anomaly_alert
  name: 股票异动预警
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 检测个股的异常价格波动和成交量异动，包括急涨急跌、巨量成交、量价背离等异常模式，生成预警信号。适用于风险监控和及时止损。
  depends_on:
    - stock_price_trend
    - stock_volume_analysis
  source_atomic_entities:
    - daily_kline
  composition_type: exception_detection
  composition_rule:
    logic: |
      1. 价格异常检测：当日涨跌幅>9%（急涨）或<-9%（急跌），或连续3日同向涨跌>15%。
      2. 成交量异常检测：当日成交量>20日均量的3倍（巨量），或<20日均量的0.3倍（地量）。
      3. 量价背离检测：价格新高但成交量萎缩（顶背离风险），或价格新低但成交量放大（底部放量机会/风险）。
      4. 振幅异常检测：当日振幅>15%（极端波动）。
      5. 综合判断：触发任一条即生成预警，多条触发为强预警。
    explanation: 基于统计学阈值的异常检测，识别需要关注的极端事件。
  business_keywords:
    - 异动
    - 预警
    - 急涨
    - 急跌
    - 巨量
    - 天量
    - 地量
    - 量价背离
    - 异常波动
    - 风险提醒
  example_queries:
    - 今天有哪些股票出现异动？
    - 有没有突然暴跌的股票？
    - 哪些股票成交量突然放大？
    - 有什么需要警惕的风险信号？
  interpretation_rule: 触发异常类型和数量决定预警级别：1条为"关注"，2条为"警惕"，3条及以上为"强预警"。
  answer_template: "⚠️ {{code}} {{name}} 触发异动预警（{{alert_level}}）：{{alert_reasons}}。最后一次异常发生在{{last_alert_date}}。"
  assumptions:
    - "涨跌幅阈值（±9%）、成交量倍数（3x/0.3x）、振幅阈值（15%）为经验设定值，科创板/北交所等不同板块可能需要调整阈值。"
    - "异常检测仅基于日K线数据，不涉及基本面信息。"
  validation_cases:
    - input: { code: "600519", date_range: "last_5_days" }
      expected: alert_level in ("无预警", "关注", "警惕", "强预警")
    - input: { date: "2026-06-02" }
      expected: alerts is list

- id: sector_rotation_signal
  name: 板块轮动信号
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 通过比较各行业近期和更早期的表现排名变化，识别行业动量的变化方向，判断资金在行业间的流动趋势，给出板块轮动方向建议。
  depends_on:
    - industry_performance
  source_atomic_entities:
    - daily_kline
    - stock_basic_info
  composition_type: trend
  composition_rule:
    logic: |
      1. 计算各行业近5日和近20日的平均涨跌幅排名。
      2. 比较两个排名：排名上升显著的行业为"资金流入/转强"，排名下降显著的为"资金流出/转弱"。
      3. 识别持续走强（近5日和近20日均为Top 5）和持续走弱（均为Bottom 5）的行业。
      4. 识别拐点行业：近5日排名较近20日提升超过10位（启动信号）或下降超过10位（见顶信号）。
      5. 输出：建议关注行业、建议回避行业、拐点行业。
    explanation: 基于行业排名的动量变化识别板块轮动，比单纯看当日涨跌更能反映趋势性资金流动。
  business_keywords:
    - 板块轮动
    - 行业切换
    - 资金流向
    - 行业趋势
    - 转强
    - 转弱
    - 热点板块
    - 行业配置
  example_queries:
    - 最近哪些板块在走强？
    - 资金在从哪个行业流向哪个行业？
    - 有没有行业启动信号？
    - 应该回避哪些行业？
  answer_template: "板块轮动分析：持续强势行业{{strong_sectors}}，持续弱势行业{{weak_sectors}}，启动拐点行业{{turning_up_sectors}}，见顶拐点行业{{turning_down_sectors}}。建议关注：{{recommendation}}。"
  assumptions:
    - "排名提升/下降的显著性阈值（10位）为经验值，行业总数约几十个，10位变化约对应四分位跨度的变动。"
    - "行业分类使用申万三级分类，粒度较细，可能需要向上聚合到一级或二级行业做更宏观的判断。"
    - "近5日和近20日的对比周期为常见设定，可根据投资周期调整。"
  validation_cases:
    - input: {}
      expected: strong_sectors is list, weak_sectors is list
    - input: { lookback_short: "5d", lookback_long: "20d" }
      expected: turning_up_sectors is list

- id: top_stock_selection
  name: 优选股票推荐
  entity_type: concept
  concept_layer: L2_decision_concept
  version: 1
  description: 综合多周期趋势确认、信号强度和综合评分，从全市场筛选出最具投资价值的股票列表。适用于构建选股池和投资组合决策。
  depends_on:
    - stock_price_trend
    - multi_period_alignment
    - stock_signal_summary
    - stock_composite_score_overview
  source_atomic_entities:
    - daily_kline
    - weekly_kline
    - monthly_kline
    - stock_signal
    - composite_score_detail
  composition_type: segment
  composition_rule:
    logic: |
      1. 初筛：日线趋势为上升，且 is_active=1（在市股票）。
      2. 周期确认：多周期共振方向至少"偏强"（三线共振向上或二上一下），淘汰日周月三级全部向下的股票。
      3. 信号过滤：信号偏多或中性，淘汰信号偏空的股票。
      4. 评分排序：按综合评分 total_score 从高到低排序。
      5. 二次过滤：confidence < 0.5 的股票标记为"低可信度"并降权。
      6. 输出：Top 20 推荐列表，附评分、趋势、关键信号和可信度。
    explanation: 多维度漏斗筛选模型，从全市场逐步过滤到高确信度的候选股票池。
  business_keywords:
    - 选股
    - 股票推荐
    - 股票池
    - 优选
    - 精选
    - 强势股
    - 投资组合
    - 选股策略
  example_queries:
    - 推荐几只好股票？
    - 最近哪些股票最值得买？
    - 帮我选20只强势股？
    - 按照综合评分最高的股票有哪些？
  interpretation_rule: 排名1-5为"强烈推荐"，6-10为"推荐"，11-20为"关注"。每只股票附一句话推荐理由。
  answer_template: "基于多维度筛选，为您推荐以下股票：{{#stocks}}{{rank}}. {{code}} {{name}} — 综合评分{{total_score}}（{{level_cn}}），趋势{{trend_desc}}，{{reason}}。{{/stocks}}"
  assumptions:
    - "筛选漏斗的每层过滤条件均为初始设计，各阈值需要根据历史回测效果调整。"
    - "⚠️ signals、indicators、composite_scores 表当前均无数据，选股策略的实际效果需待数据上线后验证。"
    - "初筛使用日线趋势，未考虑基本面和估值因素。"
  validation_cases:
    - input: { limit: 20 }
      expected: stocks is list, each stock has total_score and level_cn
    - input: { min_confidence: 0.5 }
      expected: all stocks have confidence >= 0.5

